{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h1>Смена пароля</h1>
{% if forced %}<p class="warn">Вы вошли с временным паролем — смените его перед работой.</p>{% endif %}
<form method="post" action="/password" class="card-form">
  <label>Новый пароль <input name="new_password" type="password" required minlength="8" autofocus></label>
  <label>Повторите <input name="new_password2" type="password" required minlength="8"></label>
  <button type="submit">Сменить</button>
</form>
{% endblock %}
